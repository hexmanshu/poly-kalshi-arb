# Collect price snapshots every 15 minutes (NO SECRETS REQUIRED)
# This workflow fetches PUBLIC price data from Kalshi and Polymarket
# Works immediately after merge - no configuration needed!

name: Collect Prices

on:
  schedule:
    - cron: '*/15 * * * *'  # Every 15 minutes
  workflow_dispatch:  # Manual trigger
  push:
    branches: [main, master]
    paths:
      - 'src/bin/price_collector.rs'
      - '.github/workflows/collect-prices.yml'

# Ensure only one instance runs at a time
concurrency:
  group: price-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write  # For committing data

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-collector-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-collector-

      - name: Build collector
        run: cargo build --release --bin price-collector

      - name: Create data directory
        run: mkdir -p data

      - name: Download previous database
        uses: dawidd6/action-download-artifact@v3
        with:
          name: price-snapshots-db
          path: data/
          if_no_artifact_found: warn
          workflow_conclusion: success
        continue-on-error: true

      - name: Collect snapshot (PUBLIC DATA - NO AUTH NEEDED)
        run: |
          cd data
          ../target/release/price-collector
        env:
          # No secrets needed - uses public endpoints only

      - name: Upload database artifact
        uses: actions/upload-artifact@v4
        with:
          name: price-snapshots-db
          path: data/price_snapshots.db
          retention-days: 90
          if-no-files-found: error

      - name: Generate summary
        run: |
          echo "### 📸 Price Snapshot Collected" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Time:** $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_STEP_SUMMARY
          if [ -f data/price_snapshots.db ]; then
            echo "- **Database:** $(du -h data/price_snapshots.db | cut -f1)" >> $GITHUB_STEP_SUMMARY
            # Show recent near-arbs if any
            cd data && ../target/release/price-collector --analyze 2>/dev/null | head -30 >> $GITHUB_STEP_SUMMARY || true
          fi
